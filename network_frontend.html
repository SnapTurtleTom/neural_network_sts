<!DOCTYPE html>
<html>
<head>
   <title>Draw mouse with HTML</title>
   <style>
      .content{
         display: flex;
         justify-content: center;
         align-items: center;
         flex-direction: column;
      }
      #canvas{
         border: 3px solid seagreen;
         width: 360px;
         height: 360px;
      }
   </style>
</head>
<body>
   <div class="content">
      <h1>
         Drawing with mouse Event
      </h1>
      <canvas id="canvas" width="360" height="360" style="background-color: rgb(0, 0, 0);"></canvas>
   </div>
   <script>
      var x = 0;
      var y = 0;
      var isdrawing = false;
      const cnv = document.getElementById("canvas");
      const ctx = cnv.getContext("2d");
      cnv.addEventListener("mousedown", (e) => {
         x = e.offsetX;
         y = e.offsetY;
         isdrawing = true;
      });
      cnv.addEventListener("mousemove" ,(e) =>{
         if(isdrawing === true){
            drawLine(x, y, e.offsetX, e.offsetY);
            x = e.offsetX; 
            y = e.offsetY;
         }
      });
      cnv.addEventListener("mouseup" ,(e) => {
         if( isdrawing === true){
            drawLine(x, y, e.offsetX, e.offsetY);
            x = 0;
            y = 0;
            isdrawing = false;
         }
      });
      function drawLine(x1, y1, x2, y2){
         ctx.beginPath();
         ctx.strokeStyle = "white";
         ctx.lineWidth = 10;
         ctx.moveTo(x1, y1);
         ctx.lineTo(x2, y2);
         ctx.stroke();
         ctx.closePath();
      }
      function erase() {
         ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
   </script>
   <button onclick="erase()">Erase</button>
   <form action="/upload-page" method="post" enctype="multipart/form-data">
  <label for="image_uploads">Choose images to upload (PNG, JPG)</label>
  <input
    type="file"
    id="image_uploads"
    name="image_uploads"
    accept="image/png, image/jpeg"
    multiple
  />
  <button>Send Files</button>
</form>

</body>
</html>
