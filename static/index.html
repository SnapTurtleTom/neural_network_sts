<!DOCTYPE html>
<html>
<head>
   <title>CIFAR-10 Neural Network Classifier</title>
   <style>
      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
      }

      body {
         font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
         background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
         min-height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center;
         padding: 20px;
      }

      .container {
         background: white;
         border-radius: 15px;
         box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
         padding: 40px;
         max-width: 600px;
         width: 100%;
      }

      h1 {
         text-align: center;
         color: #333;
         margin-bottom: 10px;
         font-size: 28px;
      }

      .subtitle {
         text-align: center;
         color: #666;
         margin-bottom: 30px;
         font-size: 14px;
      }

      .content {
         display: flex;
         flex-direction: column;
         align-items: center;
         gap: 20px;
      }

      #canvas {
         border: 3px solid #667eea;
         border-radius: 10px;
         width: 360px;
         height: 360px;
         cursor: crosshair;
         background-color: #000;
         box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .controls {
         display: flex;
         gap: 10px;
         width: 100%;
         justify-content: center;
         flex-wrap: wrap;
      }

      button {
         padding: 12px 24px;
         font-size: 16px;
         border: none;
         border-radius: 8px;
         cursor: pointer;
         font-weight: 600;
         transition: all 0.3s ease;
      }

      .btn-erase {
         background-color: #f56565;
         color: white;
      }

      .btn-erase:hover {
         background-color: #e53e3e;
         transform: translateY(-2px);
         box-shadow: 0 5px 15px rgba(245, 101, 101, 0.3);
      }

      .btn-predict {
         background-color: #667eea;
         color: white;
         flex: 1;
         min-width: 150px;
      }

      .btn-predict:hover {
         background-color: #5a67d8;
         transform: translateY(-2px);
         box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }

      .btn-predict:disabled {
         background-color: #cbd5e0;
         cursor: not-allowed;
         transform: none;
      }

      .result {
         width: 100%;
         margin-top: 20px;
         padding: 20px;
         border-radius: 10px;
         background-color: #f7fafc;
         border-left: 4px solid #667eea;
         display: none;
      }

      .result.show {
         display: block;
         animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
         from {
            opacity: 0;
            transform: translateY(-10px);
         }
         to {
            opacity: 1;
            transform: translateY(0);
         }
      }

      .result-title {
         font-weight: 700;
         color: #2d3748;
         margin-bottom: 10px;
         font-size: 16px;
      }

      .predicted-class {
         font-size: 24px;
         font-weight: 700;
         color: #667eea;
         margin-bottom: 15px;
      }

      .confidence-bar {
         margin-bottom: 10px;
      }

      .confidence-label {
         font-size: 12px;
         color: #4a5568;
         margin-bottom: 5px;
         display: flex;
         justify-content: space-between;
      }

      .confidence-value {
         font-weight: 600;
         color: #667eea;
      }

      .bar {
         width: 100%;
         height: 8px;
         background-color: #e2e8f0;
         border-radius: 4px;
         overflow: hidden;
      }

      .bar-fill {
         height: 100%;
         background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
         transition: width 0.3s ease;
      }

      .probabilities {
         margin-top: 15px;
         padding-top: 15px;
         border-top: 1px solid #e2e8f0;
      }

      .probability-item {
         display: flex;
         justify-content: space-between;
         padding: 8px 0;
         font-size: 14px;
         color: #4a5568;
      }

      .loading {
         text-align: center;
         display: none;
         color: #667eea;
         font-weight: 600;
      }

      .loading.show {
         display: block;
      }

      .error {
         color: #f56565;
         padding: 15px;
         background-color: #fff5f5;
         border-left: 4px solid #f56565;
         border-radius: 8px;
         display: none;
         margin-top: 20px;
      }

      .error.show {
         display: block;
      }

      .API_URL_NOTE {
         text-align: center;
         margin-top: 20px;
         padding-top: 20px;
         border-top: 1px solid #e2e8f0;
         color: #718096;
         font-size: 12px;
      }
   </style>
</head>
<body>
   <div class="container">
      <h1>🎨 CIFAR-10 Classifier</h1>
      <p class="subtitle">Draw an object and the AI will classify it</p>
      
      <div class="content">
         <canvas id="canvas" width="360" height="360"></canvas>
         
         <div class="controls">
            <button class="btn-erase" onclick="erase()">Clear Canvas</button>
            <button class="btn-predict" onclick="predict()">Predict</button>
         </div>

         <div class="loading" id="loading">
            <p>Analyzing image...</p>
         </div>

         <div class="error" id="error"></div>

         <div class="result" id="result">
            <div class="result-title">Prediction Result</div>
            <div class="predicted-class" id="predictedClass">—</div>
            <div class="confidence-bar">
               <div class="confidence-label">
                  <span>Confidence</span>
                  <span class="confidence-value" id="confidenceValue">0%</span>
               </div>
               <div class="bar">
                  <div class="bar-fill" id="barFill" style="width: 0%"></div>
               </div>
            </div>
            <div class="probabilities" id="probabilitiesList"></div>
         </div>

         <div class="API_URL_NOTE">
            Change API_URL in the HTML if running on a different server
         </div>
      </div>
   </div>

   <script>
      // ============ Configuration ============
      // Change this to your API URL when deployed
      const API_URL = window.location.origin + "/api";
      // Or for local testing:
      // const API_URL = "http://localhost:8000";
      
      // ============ Canvas Drawing Setup ============
      var x = 0;
      var y = 0;
      var isDrawing = false;
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      canvas.addEventListener("mousedown", (e) => {
         x = e.offsetX;
         y = e.offsetY;
         isDrawing = true;
      });

      canvas.addEventListener("mousemove", (e) => {
         if (isDrawing === true) {
            drawLine(x, y, e.offsetX, e.offsetY);
            x = e.offsetX;
            y = e.offsetY;
         }
      });

      canvas.addEventListener("mouseup", (e) => {
         if (isDrawing === true) {
            drawLine(x, y, e.offsetX, e.offsetY);
            x = 0;
            y = 0;
            isDrawing = false;
         }
      });

      canvas.addEventListener("mouseleave", (e) => {
         isDrawing = false;
      });

      // Touch support for mobile
      canvas.addEventListener("touchstart", (e) => {
         const rect = canvas.getBoundingClientRect();
         x = e.touches[0].clientX - rect.left;
         y = e.touches[0].clientY - rect.top;
         isDrawing = true;
      });

      canvas.addEventListener("touchmove", (e) => {
         if (isDrawing === true) {
            const rect = canvas.getBoundingClientRect();
            const newX = e.touches[0].clientX - rect.left;
            const newY = e.touches[0].clientY - rect.top;
            drawLine(x, y, newX, newY);
            x = newX;
            y = newY;
         }
      });

      canvas.addEventListener("touchend", (e) => {
         isDrawing = false;
      });

      function drawLine(x1, y1, x2, y2) {
         ctx.beginPath();
         ctx.strokeStyle = "white";
         ctx.lineWidth = 10;
         ctx.lineCap = "round";
         ctx.lineJoin = "round";
         ctx.moveTo(x1, y1);
         ctx.lineTo(x2, y2);
         ctx.stroke();
         ctx.closePath();
      }

      function erase() {
         ctx.clearRect(0, 0, canvas.width, canvas.height);
         document.getElementById("result").classList.remove("show");
         document.getElementById("error").classList.remove("show");
      }

      // ============ Prediction ============
      async function predict() {
         const loadingEl = document.getElementById("loading");
         const errorEl = document.getElementById("error");
         const resultEl = document.getElementById("result");
         const predictBtn = document.querySelector(".btn-predict");

         // Hide previous results
         errorEl.classList.remove("show");
         resultEl.classList.remove("show");
         loadingEl.classList.add("show");
         predictBtn.disabled = true;

         try {
            // Get canvas data as base64
            const imageData = canvas.toDataURL("image/png");

            // Send to API
            const response = await fetch(API_URL + "/predict-base64", {
               method: "POST",
               headers: {
                  "Content-Type": "application/json",
               },
               body: JSON.stringify({ image: imageData }),
            });

            if (!response.ok) {
               throw new Error(`API error: ${response.status} ${response.statusText}`);
            }

            const result = await response.json();

            // Display results
            displayResults(result);
            resultEl.classList.add("show");

         } catch (error) {
            console.error("Error:", error);
            errorEl.textContent = `Error: ${error.message}. Make sure the API is running.`;
            errorEl.classList.add("show");
         } finally {
            loadingEl.classList.remove("show");
            predictBtn.disabled = false;
         }
      }

      function displayResults(result) {
         const predictedEl = document.getElementById("predictedClass");
         const confidenceValueEl = document.getElementById("confidenceValue");
         const barFillEl = document.getElementById("barFill");
         const probabilitiesListEl = document.getElementById("probabilitiesList");

         // Update predicted class
         predictedEl.textContent = result.predicted_class.toUpperCase();

         // Update confidence
         const confidence = Math.round(result.confidence * 100);
         confidenceValueEl.textContent = confidence + "%";
         barFillEl.style.width = confidence + "%";

         // Update probabilities list
         probabilitiesListEl.innerHTML = "";
         const probabilities = result.all_probabilities;
         const sortedProbs = Object.entries(probabilities)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 10); // Top 10

         sortedProbs.forEach(([className, prob]) => {
            const percentage = Math.round(prob * 100);
            const item = document.createElement("div");
            item.className = "probability-item";
            item.innerHTML = `
               <span>${className}</span>
               <span>${percentage}%</span>
            `;
            probabilitiesListEl.appendChild(item);
         });
      }
   </script>
</body>
</html>
